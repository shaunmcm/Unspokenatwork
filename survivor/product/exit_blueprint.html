<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Exit Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--text:#eceae4;--muted:#a7a49c;--accent:#e8743b;--accent2:#f0a35e;--good:#6fbf8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{font-family:Lora,Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2.1rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:600;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 18px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px 22px;font:600 1rem Inter,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 44px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:#2a1d15;color:var(--accent2);font-weight:700;display:flex;align-items:center;justify-content:center}
.progress{height:6px;background:#232733;border-radius:6px;overflow:hidden;margin:6px 0 22px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{font-family:Lora,Georgia,serif;font-size:1.35rem;margin:0 0 6px}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#12151b;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--text);font:500 .98rem Inter,sans-serif;cursor:pointer}
.opt .box{width:20px;height:20px;border-radius:5px;border:2px solid #555c6b;flex:none}
.opt.radio .box{border-radius:50%}
.opt.on{border-color:var(--accent);background:#1e1712}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
input[type=number],input[type=text]{width:100%;background:#12151b;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--text);font:500 1.05rem Inter,sans-serif}
.match{border-left:4px solid var(--accent)}
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#2a1d15;color:var(--accent2);margin-right:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tab{background:#12151b;border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font:600 .9rem Inter,sans-serif;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
ul.clean{padding-left:20px;margin:0 0 1em}
ul.clean li{margin-bottom:6px}
.check{color:var(--good);font-weight:700}
.wk{border-top:1px solid var(--line);padding:12px 0}
.wk b{color:var(--accent2)}
.num{font-family:Lora,Georgia,serif;font-size:1.6rem;color:var(--accent2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}h1{font-size:1.75rem}}
.note{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.hide{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}.tbl th{color:var(--muted);font-weight:600}.tbl td:last-child,.tbl th:last-child{white-space:nowrap;text-align:right}
.wkhead{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:var(--text);font:500 1rem Inter,sans-serif;cursor:pointer;padding:4px 0;text-align:left}
.day{border-top:1px solid var(--line);padding:12px 0 6px}.day.work .dhead{color:var(--accent2)}.dhead{font-weight:600;font-size:.92rem;margin-bottom:6px}
.task{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;font-size:.95rem;cursor:pointer}.task input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222833;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

 ["fix","Fixing things around the house"],["car","Working on cars, engines or bikes"],["build","Building / carpentry"],

const QUESTIONS = [
 {id:"name",type:"text",q:"First, what should we call you?",sub:"Your plan will be written for you by name.",ph:"First name"},
 {id:"job",type:"radio",q:"What kind of work do you do now?",sub:"The skills you use every day are worth more than you think.",opts:[

 {id:"goal",type:"number",q:"How much extra money a month do you want this side business to put in your pocket?",sub:"After costs and taxes. Your plan will show exactly what it takes to get there, and how long.",ph:"e.g. 1000"}

const qOpts = id => QUESTIONS.find(q => q.id === id).opts;

  kit:[["Shop vac, brushes, microfiber towels",120,null],["Cleaners, polish, tire shine",80,null],["Water tank or a customer's hose (start with their hose)",0,null],["Small polisher (later, once you're booked)",0,null]],
  where:"Coworkers' cars first (in the parking lot, with permission), then before/after posts and your church or gym",

  kit:[["Socket set and specialty tools (skip what you own)",150,"tools"],["Common parts: plugs, filters, belts, tubes",80,null],["Space to work (garage or carport)",0,"garage"]],

  offers:["TV mounting + setup","Wi-Fi dead-spot fix and smart-home setup","Phone and computer help for older adults"],

  mistakes:["Blasting siding, wood or screens with high pressure and causing damage.","Pricing by the hour instead of by the job.","Skipping insurance on someone's house."]},
 detail:{lo:120,hi:250,hrs:3.5,cost:15,over:50,unit:"detail",

 repair:{lo:60,hi:150,hrs:1.5,cost:20,over:20,unit:"repair",

/* ---------------- SCORING ---------------- */
function score(){
  const skills = A.skills || [], asked = (A.asked || []).filter(x => x !== "none"), tools = (A.tools || []).filter(x => x !== "none");
  const budget = Number(A.budget || 100), hours = Number(A.hours || 3), talk = Number(A.talk || 1);
  return PATHS.map(p => {
    let s = 0; const why = [];
    for(const [k, w] of Object.entries(p.w)){
      if(skills.includes(k)){ s += w; }
      if(asked.includes(k)){ s += w * 1.5; why.push(`People already ask you for help with ${labelOf(SKILLS, k).toLowerCase().replace('bbq','BBQ')}.`); }
      else if(skills.includes(k)){ why.push(`You're good at ${labelOf(SKILLS, k).toLowerCase().replace('bbq','BBQ')}.`); }
      if(tools.includes(k)){ s += w; why.push(`You already have ${HAVE[k]}.`); }
      if(A.job === k){ s += w; why.push(`Your day job (${labelOf(QUESTIONS[1].opts, k).toLowerCase()}) already trained you for this.`); }
    }
    // body + preference
    if(A.physical === "no" && p.phys === 2){ s -= 8; }
    if(A.physical === "some" && p.phys === 2){ s -= 3; }
    if(A.hands === "screen"){ s += p.phys === 0 ? 3 : p.phys === 2 ? -3 : 0; }
    if(A.hands === "hands"){ s += p.phys >= 1 ? 2 : -2; }
    if(A.where === "online"){ s += p.mode === "online" ? 3 : p.mode === "either" ? 1 : -2; }
    if(A.where === "local"){ s += p.mode === "online" ? -1 : 1; }
    if(talk === 0 && p.talk >= 1){ s -= 1; }
    // budget: cost after subtracting tools they own
    const kitCost = p.kit.reduce((t, [, c, have]) => t + (have && tools.includes(have) ? 0 : c), 0);
    if(kitCost > budget){ s -= Math.min(5, (kitCost - budget) / 150); }
    if(hours <= 3 && p.id === "bbq") s -= 1;
    return {p, s, why: [...new Set(why)].slice(0, 4), kitCost};
  }).sort((a, b) => b.s - a.s);
}

/* ---------------- MONEY MATH ---------------- */
const pl = e => e.unit + "s";
const TAX = 0.25; // rough set-aside for self-employment + income tax
function money_model(p){
  const e = ECON[p.id]; const mid = Math.round((e.lo + e.hi) / 2 / 5) * 5;
  const unitCost = e.costPct ? Math.round(mid * e.costPct) : e.cost;
  const net = mid - unitCost;                      // profit per unit before tax
  const goal = Math.max(0, Number(A.goal || 0));
  const needProfit = goal / (1 - TAX) + e.over;     // monthly profit before tax needed
  const units = Math.max(1, Math.ceil(needProfit / net));
  const hrsNeed = Math.round(units * e.hrs * 1.15); // +15% for messages, quotes, driving
  const hrsHave = Math.round(Number(A.hours || 3) * 4.33);
  const capUnits = Math.max(1, Math.floor(hrsHave / (e.hrs * 1.15)));
  const fits = units <= capUnits;
  const capTake = Math.max(0, Math.round((capUnits * net - e.over) * (1 - TAX)));
  const priceNeeded = Math.ceil(((needProfit) / capUnits + unitCost) / 5) * 5;
  const hoursForGoal = Math.ceil(hrsNeed / 4.33);
  const takeAt = u => Math.max(0, Math.round((u * net - e.over) * (1 - TAX)));
  const plannedUnits = Math.min(units, capUnits);
  // ramp: month 1 is mostly setup, month 2 builds, month 3 near full speed
  const ramp = [Math.round(plannedUnits * 0.25), Math.round(plannedUnits * 0.6), Math.round(plannedUnits * 0.9)];
  return {e, mid, unitCost, net, goal, needProfit, units, hrsNeed, hrsHave, capUnits, fits, capTake, priceNeeded, hoursForGoal, takeAt, plannedUnits, ramp};
}

    `Ask your 5 happiest customers for a review if they haven't left one.`,

  const milestones = {

  const start = planStart(); const out = []; let si = 0, gi = 0, ti = 0, mi = 0;
  for(let n = 1; n <= 90; n++){

    <div class="card"><h3>What it takes to succeed</h3><ul class="clean">${e.success.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      <h3>Mistakes that sink most beginners</h3><ul class="clean">${e.mistakes.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="card"><h3>Your schedule</h3><p>You'll work about ${m.hrsHave} hours a month on your chosen days. One ${e.unit} takes about ${e.hrs} hour${e.hrs === 1 ? "" : "s"} including travel and setup, so at full speed you have room for about <b>${m.capUnits} ${pl(e)} a month</b>.</p>
      <h3>How to talk to customers</h3><p>${Number(A.talk || 1) === 0 ? "You said you'd rather not sell. You don't have to be a salesman: post your work, answer questions honestly, and ask happy customers to send friends. Use this message as-is:" : "Use this message for friends, family and coworkers:"}</p>
      <p style="background:#12151b;border:1px solid var(--line);border-radius:10px;padding:12px">"Hey, I've started doing ${esc(p.offers[0].split(":")[0].split("(")[0].trim().toLowerCase())} on the side. If you or anyone you know needs it, I'd really appreciate it. Here's what I charge: [your price]."</p>
      <h3>Rules to check first</h3><p>${esc(p.rules)} Also read your employer's policy on side work.</p></div>
  </div>

  <div class="${view === "money" ? "" : "hide"}">
    <h2>Costs and your money goal</h2>
    <div class="card"><h3>What it costs to start (estimates)</h3>
      <table class="tbl"><tr><th>Item</th><th>Cost</th></tr>${kitRows}<tr><td><b>Your startup total</b></td><td><b>≈ ${money(t.kitCost)}</b></td></tr></table>
      <h3 style="margin-top:18px">What it costs to run (estimates)</h3>
      <table class="tbl">
        <tr><td>Monthly costs (insurance, ads, apps, phone)</td><td>≈ ${money(e.over)}/month</td></tr>
        <tr><td>Supplies and gas per ${e.unit}</td><td>≈ ${money(m.unitCost)}</td></tr>
        <tr><td>Taxes to set aside on profit</td><td>about ${Math.round(TAX * 100)}% (ask a tax pro for your exact rate)</td></tr>
      </table></div>
    <div class="card"><h3>What you could charge (estimate)</h3>
      <p>A common range is about <b>${money(e.lo)}–${money(e.hi)} ${e.profitOnly ? "profit per flip (sale price minus what you paid)" : "per " + e.unit}</b>. Your plan uses the middle, about <b>${money(m.mid)}</b>. That leaves about <b>${money(m.net)}</b> per ${e.unit} after supplies, or about <b>${money(Math.round(m.net * (1 - TAX)))}</b> after setting aside taxes. Prices vary a lot by area, so check 5 local competitors in week 1 and adjust.</p></div>
    <div class="card match"><h3>How to reach ${money(m.goal)} a month</h3>
      ${m.goal > 0 ? `
      <p>To put <b>${money(m.goal)}</b> in your pocket each month, you'd need about <b>${money(Math.round(m.needProfit))}</b> in monthly profit before taxes and monthly costs. At about ${money(m.net)} profit per ${e.unit}, that's about:</p>
      <div class="grid2"><div class="card" style="margin:0"><div class="muted">${e.recurring ? "Monthly clients" : pl(e) + " per month"}</div><div class="num">${m.units}</div><p style="margin:0">${e.recurring ? "each paying every month" : "about " + Math.max(1, Math.round(m.units / 4.33)) + " a week"}</p></div>
      <div class="card" style="margin:0"><div class="muted">Hours per month</div><div class="num">${m.hrsNeed}</div><p style="margin:0">about ${m.hoursForGoal} hours a week</p></div></div>
      <p style="margin-top:14px">${m.fits ? `<b>That fits inside the ${m.hrsHave} hours a month you have.</b> At full speed (usually around month 3, once customers come back and refer friends), your goal is within reach.` : `<b>That's more than the ${m.hrsHave} hours a month you have.</b> At your hours, full speed is about ${m.capUnits} ${pl(e)} a month, or about <b>${money(m.capTake)}</b> take-home. To close the gap you can: <br>• raise your average price to about <b>${money(m.priceNeeded)}</b> per ${e.unit} (bigger jobs, bundles, premium offers), <br>• give it about <b>${m.hoursForGoal} hours a week</b> instead, or <br>• grow into it: hit ${money(m.capTake)} first, then raise prices as reviews come in.`}</p>
      <h3>Your month-by-month targets (estimates)</h3>
      <table class="tbl"><tr><th></th><th style="text-align:right">${pl(e)[0].toUpperCase() + pl(e).slice(1)}</th><th>Take-home ≈</th></tr>
        <tr><td>Month 1 (mostly setup)</td><td>${m.ramp[0]}</td><td>${money(m.takeAt(m.ramp[0]))}</td></tr>
        <tr><td>Month 2 (first customers)</td><td>${m.ramp[1]}</td><td>${money(m.takeAt(m.ramp[1]))}</td></tr>
        <tr><td>Month 3 (getting steady)</td><td>${m.ramp[2]}</td><td>${money(m.takeAt(m.ramp[2]))}</td></tr>
        <tr><td>Full speed</td><td>${m.plannedUnits}</td><td>${money(m.takeAt(m.plannedUnits))}</td></tr></table>
      <p class="muted" style="margin-top:10px">Month 1 take-home can be $0 or negative while you buy your kit. That's normal.</p>` : `<p>Go back and enter a monthly goal to see the math.</p>`}
    </div>
  </div>

  <div class="${view === "exit" ? "" : "hide"}">
    <h2>Your exit numbers</h2>
    <div class="card">
      <p>Your must-pays: <b>${money(must)}</b> a month. Right now you could cover them for ${savedTxt}.</p>
      <div class="grid2">
        <div class="card" style="margin:0"><div class="muted">Milestone 1</div><div class="num">${money(must * .25)}/mo</div><p style="margin:0">Side income covers a quarter of your must-pays. Breathing room.</p></div>
        <div class="card" style="margin:0"><div class="muted">Milestone 2</div><div class="num">${money(must * .5)}/mo</div><p style="margin:0">Half your must-pays, 3 months in a row. Real options.</p></div>
        <div class="card" style="margin:0"><div class="muted">Milestone 3</div><div class="num">${money(must)}/mo</div><p style="margin:0">Side income covers all your must-pays, 3 months in a row.</p></div>
        <div class="card" style="margin:0"><div class="muted">Safety net</div><div class="num">${money(must * 6)}</div><p style="margin:0">Six months of must-pays saved. Many planners suggest 3–6 months; with a family, aim for the top.</p></div>
      </div>
      <p style="margin-top:14px">${m.goal >= must && must > 0 ? `Your goal of ${money(m.goal)} a month would reach Milestone 3.` : must > 0 ? `Your goal of ${money(m.goal)} a month is ${Math.round(m.goal / must * 100)}% of your must-pays. That's a strong start toward Milestone ${m.goal >= must * .5 ? 2 : 1}.` : ""}</p>
      <p><b>Safe to leave</b> means all three: side income has covered your must-pays for 3 straight months, the safety net is saved, and you've sorted out health insurance and other benefits your job gives your family. Until then, the job is the funding for the plan.</p>
    </div>
  </div>

  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="A={};save();intro()">Retake the quiz</button></div>
  ${disclosure()}`;
}
function tick(pid, key, val){ let d = {}; try{ d = JSON.parse(localStorage.getItem("ebDone_" + pid) || "{}"); }catch(e){} d[key] = val; try{ localStorage.setItem("ebDone_" + pid, JSON.stringify(d)); }catch(e){} }
function copyPlan(){
  const top = score().slice(0, 3); const p = top[activeTab].p; const plan = buildPlanner(p);
  const lines = [`${A.name || "My"} Exit Blueprint: ${p.name}`, "Estimates only. No guaranteed results.", ""];
  plan.forEach(d => { lines.push(`Day ${d.n} (${d.date.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"})})${d.work ? " WORK BLOCK" : ""}`); d.tasks.forEach(t => lines.push("[ ] " + t)); lines.push(""); });
  const doneMsg = () => { const t = document.createElement("div"); t.className = "toast"; t.textContent = "All 90 days copied. Paste into your notes."; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); };
  try{ navigator.clipboard.writeText(lines.join("\n")).then(doneMsg, () => alertFallback(lines)); }catch(e){ alertFallback(lines); }
}
function alertFallback(lines){
  const ta = document.createElement("textarea"); ta.value = lines.join("\n"); ta.style.cssText = "width:100%;height:260px;margin-top:12px;background:#12151b;color:#eceae4;border:1px solid #2a2f3a;border-radius:10px;padding:10px";
  document.getElementById("app").appendChild(ta); ta.select();
}
intro();
</script>

</body>
</html>
